    <title>Document</title>

<style>
    .box{
       max-width: 150px;
        height: 150px;
        background-color: green;
        padding: 40px;
        box-sizing: border-box;

    }
    h2{
        color: blueviolet;
        font-size: 30px;
        font-weight: lighter;
        /* font-style: italic; */
        font-family: Arial, Helvetica, sans-serif;

        /* text */
        /* text-align: right; */
        text-indent: 50px;
        /* text-decoration: overline; */
        text-transform: uppercase;
    }
    p{
        /* text-align: justify;
        width: 40px; */

        /* letter-spacing: 15px; */
        word-spacing: 10px;
    }
    h1{
        /* text-shadow: x-offset y-offset blurz(optional) color; */
        color: brown;
        text-shadow: 12px 6px 3px green;
    }
    .box1{
        width: 150px;
        height: 150px;
        background-color: rgb(12, 108, 76);
        /* box-shadow: 12px 8px 3px crimson; */
        box-shadow: 12px 8px orange,24px 16px red,36px 30px greenyellow;/*multiple shadow*/
    }
    /* css links */
    a:link{
        /* link unvisited */
        text-decoration: none;
        color: yellow;
        font-size: 20px;
        border: 2px solid brown;
        padding: 4px;
        background-color: rgb(32, 198, 29);
    }
    a:visited{
        text-decoration: none;
        color: yellow;
        font-size: 20px;
        border: 2px solid rgb(75, 42, 165);
        padding: 4px;
        background-color: rgb(84, 11, 35);
    }
    a:hover{
        text-decoration: none;
        color: rgb(51, 0, 255);
        font-size: 20px;
        border: 2px solid rgb(252, 39, 202);
        padding: 4px;
        background-color: rgb(19, 85, 12);
    }
    a:active{
        text-decoration: none;
        color: rgb(255, 0, 0);
        font-size: 20px;
        border: 2px solid rgb(88, 100, 25);
        padding: 4px;
        background-color: rgb(185,152,163);
    }
</style>
