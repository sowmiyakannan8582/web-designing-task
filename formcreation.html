<!DOCTYPE html>
<html>
    <head>
        <title>
            My forms
        </title>
    </head>
    <body>
        <!-- forms -->
         <fieldset>
            <legend>Registration Form</legend>
         <form action="./css_grid.html">

            <label for="uname" >Username</label>
            <input type="text"  id="uname" name="uname" placeholder="Enter your name" required>
            <br><br>
            <label for="pass">Password</label>
            <input type="password" id="pass"  name="pass" >
            <br><br>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
            <br><br>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <br><br>
            <label for="">Gender</label>
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>
            <label for="addr">Address</label>
            <textarea name="addr" id="addr" rows="3" cols="30"></textarea>
            <br><br>
            <label for="">Skills</label>
            <input type="checkbox">Python
            <input type="checkbox">Java
            <input type="checkbox">Cloud computing
            <input type="checkbox">AI
            <br><br>
            <label for="">Location</label>
            <select name="" id="">
                <option value="Salem">Salem</option>
                <option value="Kovai">Kovai</option>
                <option value="Trichy">Trichy</option>
                <option value="Madras">Madras</option>
                
            </select>
            <br><br>
            <label for="age">Age</label>
            <input type="number" id="age" name="Age" min="20" max="35">
            <br><br>
            <label for="dob">DOB</label>
            <input type="date" id="dob" name="dob">
            <br><br>
            <label for="res">Resume</label>
            <input type="file" id="res" name="res">
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        

         </form>
         </fieldset>

    </body>
</html>
