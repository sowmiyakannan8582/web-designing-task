<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
       
    </head>
    <style>
         table,td,tr,th{
            border : 2px solid black;
            border-collapse : collapse;
         }
    </style>
    <body>
        <table>
            <tr>
                <th>Quick</th>
                <th colspan="2">Brown fox</th>
                <th>jumps</th>
            </tr>
            <tr>
                <td rowspan="3">Over the</td>
                <td >lazy</td>
                <td >dog</td>
                <td >and</td>
            </tr>

            <tr>
                <td>then</td>
                <td>it</td>
                <td>all</td>
            </tr>
            <tr>
                <td colspan="3">prey to a lion</td>
            </tr>
            

        </table>
    </body>
   
</html>
